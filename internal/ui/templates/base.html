{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Fitness Tracker</title>
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Fitness Tracker">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    // Set before first paint to avoid a flash. Small screens always start collapsed; desktop remembers the last choice.
    (function () {
      var collapsed = window.innerWidth <= 768 || localStorage.getItem("sidebar") === "collapsed";
      if (collapsed) document.documentElement.classList.add("sidebar-collapsed");
    })();
  </script>
</head>
<body>
  <button id="sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-controls="sidebar">
    <span class="material-symbols-rounded">keyboard_double_arrow_left</span>
  </button>
  <div id="sidebar-backdrop"></div>
  <nav id="sidebar">
    {{range .Nav}}
      {{if .Name}}<div class="nav-group">{{.Name}}</div>{{end}}
      {{range .Pages}}
        <a href="{{.Path}}" class="nav-link{{if eq .Path $.Path}} active{{end}}"
           hx-get="{{.Path}}" hx-target="#content" hx-push-url="true">
          <span class="material-symbols-rounded">{{.Icon}}</span>{{.Title}}
        </a>
      {{end}}
    {{end}}
  </nav>
  <main id="content">{{template "content" .}}</main>
  <script src="/static/sortable.min.js"></script>
  <script src="/static/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>{{end}}
